<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Sincronizador Power BI</title>
  <style>
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 16px;
      background: #f8fafc;
      color: #0f172a;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
      border-bottom: 1px solid #e2e8f0;
      padding-bottom: 10px;
    }
    .title {
      font-size: 14px;
      font-weight: 700;
    }
    .subtitle {
      font-size: 11px;
      color: #64748b;
    }
    .stat-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .btn {
      width: 100%;
      padding: 9px;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      font-size: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-bottom: 8px;
    }
    .btn-green { background: #10b981; color: white; }
    .btn-blue { background: #0284c7; color: white; }
    .btn-purple { background: #6366f1; color: white; }
    .btn-outline { background: white; border: 1px solid #cbd5e1; color: #334155; }
    .status {
      font-size: 11px;
      text-align: center;
      color: #64748b;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div style="font-size: 24px;">🎓</div>
    <div>
      <div class="title">Busca Ativa Leopoldina</div>
      <div class="subtitle">Sincronizador Power BI</div>
    </div>
  </div>

  <div class="stat-card">
    <span style="font-size: 12px; color: #64748b;">Alunos Armazenados:</span>
    <span id="popup-count" style="font-weight: 800; font-size: 16px; color: #0f172a;">0</span>
  </div>

  <button id="btn-popup-autoscroll" class="btn btn-blue">
    <span>⚡</span> Rastrear Tabela na Aba Ativa
  </button>
  <button id="btn-popup-csv" class="btn btn-green">
    <span>📥</span> Baixar Planilha CSV
  </button>
  <button id="btn-popup-copy" class="btn btn-outline">
    <span>📋</span> Copiar JSON
  </button>
  <button id="btn-popup-sync" class="btn btn-purple">
    <span>🚀</span> Sincronizar com a Vercel (Nuvem)
  </button>

  <div id="popup-status" class="status">Abra a página do Power BI para capturar.</div>

  <script src="popup.js"></script>
</body>
</html>
